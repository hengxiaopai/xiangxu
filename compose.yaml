name: xiangxu-stage5

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: ${XIANGXU_STAGE5_POSTGRES_DB:?required}
      POSTGRES_USER: ${XIANGXU_STAGE5_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${XIANGXU_STAGE5_POSTGRES_PASSWORD:?required}
    labels:
      com.xiangxu.scope: gate-4-stage-5
    ports:
      - "127.0.0.1:${XIANGXU_STAGE5_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.2.8-bookworm@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    labels:
      com.xiangxu.scope: gate-4-stage-5
    ports:
      - "127.0.0.1:${XIANGXU_STAGE5_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
    labels:
      com.xiangxu.scope: gate-4-stage-5
